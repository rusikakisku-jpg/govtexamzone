name = "govtexamzone"
pages_build_output_dir = "./dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "allow_eval_during_startup"]

[vars]
NODE_ENV = "production"
ADMIN_USERNAME = "admin"

[[d1_databases]]
binding = "DB"
database_name = "govtexamzone-db"
database_id = "ce83a546-323f-467b-8748-4fe6be6a3e12"

[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "govtexamzone-files"
