name = "govtexamzone"
main = "worker.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "govtexamzone-db"
database_id = "your-d1-database-uuid-here"

# Cloudflare R2 Object Storage Binding
[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "govtexamzone-files"

[vars]
NODE_ENV = "production"
ADMIN_USERNAME = "admin"
